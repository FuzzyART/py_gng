[package]
name = "neurogas"
version = "0.0.5"
edition = "2021"

[dependencies]
# For development, use local path dependency
#neurogas = { path = "../rust_gng" }

# For production, change to: neurogas = "0.0.4"
neurogas = "0.0.4"
pyo3 = {version = "0.30.1",features = ["extension-module",
"experimental-inspect",
"generate-import-lib",
"abi3-py39"

]}
numpy = "0.30.0"

[lib]
name = "neurogas"
crate-type = ["cdylib","lib"]
