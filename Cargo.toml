[package]
name = "neurogas"
version = "0.0.4"
edition = "2021"

[dependencies]
# For development, use local path dependency
#neurogas = { path = "../rust_gng" }

# For production, change to: neurogas = "0.0.4"
neurogas = "0.0.4"
